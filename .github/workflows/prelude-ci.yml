name: Prelude CI

# CI for the PRELUDE platform living under prelude/.
# Builds the NestJS API, the Expo mobile app, and the Python ML service,
# and validates that the Docker images build.

on:
  push:
    branches: ["**"]
    paths:
      - "prelude/**"
      - ".github/workflows/prelude-ci.yml"
  pull_request:
    paths:
      - "prelude/**"
      - ".github/workflows/prelude-ci.yml"

jobs:
  api:
    name: API (NestJS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prelude/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: prelude/api/package-lock.json
      - run: npm install
      - run: npm run build

  mobile:
    name: Mobile (Expo)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prelude/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: prelude/mobile/package-lock.json
      - run: npm install
      - run: npx tsc --noEmit

  ml:
    name: ML service (FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prelude/ml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Import + smoke check
        run: python -c "import app.main; print('ml app imports OK')"

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [api, ml]
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t prelude-api ./prelude/api
      - name: Build ML image
        run: docker build -t prelude-ml ./prelude/ml
